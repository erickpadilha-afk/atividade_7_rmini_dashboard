<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Dashboard Deep Rock Galactic</title>
</head>
<body>
    <header class="barra-sticky"> 
        <section class="sticky">
            <img src="rockstone.png" width="50px" height="50px" alt="DRG Logo">
            <h4 id="site-nome">Deep Rock Galactic Corp</h4>
        </section>
        <section class="filtro-area">
            <input id="filtro" type="text" placeholder="Filtrar painéis e missões...">
        </section>
    </header>

    <main>
        <section id="missoes" class="square filtro-item">
            <h1 class="titulo-card">Missões Totais</h1>
            <h2 class="numero-destaque">90.126%</h2>
            
            <h1 class="titulo-card">Missões Máximas Concluídas</h1>
            <h2 class="numero-destaque">60.124%</h2>
            
            <h1 class="titulo-card">Média de Missões Bem Sucedidas</h1>
            <h2 class="numero-destaque">66,71%</h2>
        </section>

        <section class="square filtro-item info">
    <section class="grafico">
        <h1 class="titulo-card">Personagens mais usados</h1>
        <iframe height="371" seamless frameborder="0" scrolling="no" src="https://docs.google.com/spreadsheets/d/e/2PACX-1vR6pVTKxIaGKxnnGjiP6DuGKvjTh-k3BR0Deb6t_N3DYpCCJmRGNtB1_roeExduhACGmtlW6dVWETFL/pubchart?oid=1653310113&amp;format=interactive"></iframe>
    </section>
</section>

<section class="square filtro-item info">
    <section class="grafico">
        <h1 class="titulo-card">Minérios mais recolhidos</h1>
        <iframe height="371" seamless frameborder="0" scrolling="no" src="https://docs.google.com/spreadsheets/d/e/2PACX-1vR29jYIMKuV7dt7BGx8zXyv6ykshOmty_b7eBLWPKrXvB1BFajMl2ooWIKVu9ojo6fC27FgVgAufmrC/pubchart?oid=368490103&amp;format=interactive"></iframe>
    </section>
</section>

        <section class="square">
            <section class="info formulario">
                <h1 class="titulo-card">Novo Registro de Operação</h1>
                <input type="text" id="nomeMissao" placeholder="Nome da missão (ex: Escolta)">
                <input type="number" id="quantidade" placeholder="Quantidade de vezes">
                <button onclick="adicionarRegistro()">Adicionar Registro</button>
            </section>
        </section>

        <section class="square">
            <h1 class="titulo-card" style="margin-bottom: 15px;">Registros Atuais</h1>
            <section class="info" style="background: transparent; padding: 0; margin: 0;">
                <div id="lista-registros"></div>
            </section>
        </section>
    </main>

    <script>
        const campoFiltro = document.getElementById("filtro");
        const itens = document.querySelectorAll(".filtro-item");

        campoFiltro.addEventListener("keyup", function() {
            const texto = campoFiltro.value.toLowerCase();
            itens.forEach(item => {
                const conteudo = item.textContent.toLowerCase();
                if(conteudo.includes(texto)){
                    item.style.display = "block";
                } else {
                    item.style.display = "none";
                }
            });
        });
    </script>

    <script src="script.js"></script>
</body>
</html>
